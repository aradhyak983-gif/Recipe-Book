<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>RecipeNest | Favorites</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        background-color: #fff8f0;
      }
      header {
        background-color: #5b2c24;
        color: white;
        padding: 20px;
        text-align: center;
      }
      .back {
        display: inline-block;
        margin: 25px 7%;
        color: #5b2c24;
        text-decoration: none;
        font-weight: bold;
      }
      .heading {
        text-align: center;
        color: #5b2c24;
      }
      #favoritesContainer {
        width: 85%;
        margin: 30px auto;

        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
      }
      .favorite-card {
        background-color: white;
        border-radius: 12px;
        padding: 15px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }
      .favorite-card img {
        width: 100%;
        height: 180px;
        object-fit: cover;
        border-radius: 10px;
      }

      .favorite-card h3 {
        color: #5b2c24;
      }

      .favorite-card a {
        display: inline-block;
        background-color: #5b2c24;
        color: white;
        text-decoration: none;
        padding: 8px 15px;
        border-radius: 6px;
      }
      #emptyMessage {
        text-align: center;
        margin-top: 50px;
        color: #777;
        font-size: 18px;
      }

      @media (max-width: 900px) {
        #favoritesContainer {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (max-width: 600px) {
        #favoritesContainer {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <h1>RecipeNest</h1>

      <p>My Favorite Recipes ❤️</p>
    </header>
    <a href="recipes.html" class="back"> ← Back to Recipes </a>
    <h2 class="heading">My Favorites</h2>
    <div id="favoritesContainer"></div>
    <p id="emptyMessage">You haven't added any recipes to favorites yet.</p>
    <script src="favorites-page.js"></script>
  </body>
</html>
